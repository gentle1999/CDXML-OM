name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.13"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Pyright
        run: uv run --no-sync pyright
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Pytest
        run: uv run --no-sync pytest
      - name: Execute and check tutorial notebooks
        run: uv run --no-sync python -m tools.run_notebooks --check
      - name: Check schema and generated artifacts
        run: uv run --no-sync python -m tools.schema_compiler check
      - name: Rebuild schema artifacts
        run: uv run --no-sync python -m tools.schema_compiler build
      - name: Reject stale generated artifacts
        run: git diff --exit-code
      - name: Verify built package
        run: uv run --no-sync python tools/check_package.py
