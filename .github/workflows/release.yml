name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tagged commit on the default branch
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.9.13"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Pyright
        run: uv run --no-sync pyright

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Test suite
        run: uv run --no-sync pytest

      - name: Check and rebuild schema
        run: |
          uv run --no-sync python -m tools.schema_compiler check
          uv run --no-sync python -m tools.schema_compiler build
          git diff --exit-code

      - name: Capture source-bound feature evidence
        id: feature-evidence
        shell: bash
        run: |
          evidence_dir="$(mktemp -d "${RUNNER_TEMP}/cdxml-om-release-evidence.XXXXXX")"
          echo "directory=$evidence_dir" >> "$GITHUB_OUTPUT"
          uv run --no-sync python -m tools.schema_compiler test-features \
            --run-evidence "$evidence_dir/feature-run.json" \
            --junitxml "$evidence_dir/feature-run.xml" -- tests/coverage
          uv run --no-sync python -m tools.schema_compiler coverage \
            --test-run "$evidence_dir/feature-run.json" --format json \
            > "$evidence_dir/coverage-report.json"

      - name: Upload feature-evidence report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-feature-evidence
          path: ${{ steps.feature-evidence.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Build the distribution pair once
        run: |
          mkdir -p dist/release-bundle/packages
          uv build --no-create-gitignore --out-dir dist/release-bundle/packages

      - name: Smoke-test those exact built files
        run: uv run --no-sync python tools/check_package.py --dist-dir dist/release-bundle/packages

      - name: Validate tag and distributions, then write checksums
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run --no-sync python -m tools.release
          --tag "$RELEASE_TAG"
          --packages-dir dist/release-bundle/packages
          --bundle-dir dist/release-bundle
          --github-output "$GITHUB_OUTPUT"

      - name: Verify generated package checksums
        run: cd dist/release-bundle && sha256sum --check --strict SHA256SUMS

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/release-bundle/packages/*.whl
            dist/release-bundle/packages/*.tar.gz
            dist/release-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Publish the verified artifact to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-bundle

      - name: Verify artifact checksums
        run: cd release-bundle && sha256sum --check --strict SHA256SUMS

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/packages
          skip-existing: false
          verify-metadata: true
          attestations: true

  github-release:
    name: Create the GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download the exact build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-bundle

      - name: Verify artifact checksums
        run: cd release-bundle && sha256sum --check --strict SHA256SUMS

      - name: Create release with the same verified files
        shell: bash
        run: |
          gh --version
          prerelease_args=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release-bundle/packages/*.whl \
            release-bundle/packages/*.tar.gz \
            release-bundle/SHA256SUMS \
            --repo "$GH_REPOSITORY" \
            --title "CDXML-OM $RELEASE_VERSION" \
            --verify-tag \
            --generate-notes \
            "${prerelease_args[@]}"
