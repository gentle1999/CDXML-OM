[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cdxml-om"
dynamic = ["version"]
description = "A typed, schema-driven object model for ChemDraw CDXML documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CDXML-OM contributors" }]
dependencies = ["lxml>=5.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "mypy>=1.14",
  "packaging>=24",
  "pyright>=1.1.390",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "types-lxml>=2024.12",
  "types-PyYAML>=6.0",
]
notebooks = [
  "ipykernel>=6.29",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdxml_om"]

[tool.hatch.version]
path = "src/cdxml_om/_version.py"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/cdxml_om/_version.py" },
]

[tool.hatch.build.targets.wheel.force-include]
"src/cdxml_om/py.typed" = "cdxml_om/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tools", "tests/typecheck"]
exclude = [".venv", "build", "dist"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools", "tests/typecheck"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true
show_error_codes = true
