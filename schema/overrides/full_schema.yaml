measurement_fields:
  "CDXML@LabelSize":
    datatype: float
    codec: float
    rationale: >-
      This CDATA property is the document's default label font size. It is exposed
      as an unscaled numeric XML value; CDXString run-size units are not applied.
    provenance:
      - {source: sdk_label_style_size, locator: "LabelStyleSize property summary; default font size"}
      - {source: revvity_dtd, locator: "<!ATTLIST CDXML LabelSize>"}
  "CDXML@CaptionSize":
    datatype: float
    codec: float
    rationale: >-
      This CDATA property is the document's default caption font size. It is exposed
      as an unscaled numeric XML value; CDXString run-size units are not applied.
    provenance:
      - {source: sdk_caption_style_size, locator: "CaptionStyleSize property summary; default font size"}
      - {source: revvity_dtd, locator: "<!ATTLIST CDXML CaptionSize>"}
  "t@LabelSize":
    datatype: float
    codec: float
    rationale: >-
      This CDATA property is the text label's default font size. It is exposed as
      an unscaled numeric XML value; CDXString run-size units are not applied.
    provenance:
      - {source: sdk_label_style_size, locator: "LabelStyleSize property summary; default font size"}
      - {source: revvity_dtd, locator: "<!ATTLIST t LabelSize>"}
  "t@CaptionSize":
    datatype: float
    codec: float
    rationale: >-
      This CDATA property is the text caption's default font size. It is exposed as
      an unscaled numeric XML value; CDXString run-size units are not applied.
    provenance:
      - {source: sdk_caption_style_size, locator: "CaptionStyleSize property summary; default font size"}
      - {source: revvity_dtd, locator: "<!ATTLIST t CaptionSize>"}
  "embeddedobject@RotationAngle":
    datatype: float
    codec: float
    rationale: >-
      XML is read and written as the stated angle value without converting the
      binary fixed-point representation or inferring a binary scale for XML.
    provenance:
      - {source: sdk_rotation_angle, locator: "RotationAngle property description: angle measured in degrees"}
      - {source: revvity_dtd, locator: "<!ATTLIST embeddedobject RotationAngle>"}
  "t@RotationAngle":
    datatype: float
    codec: float
    rationale: >-
      XML is read and written as the stated angle value without converting the
      binary fixed-point representation or inferring a binary scale for XML.
    provenance:
      - {source: sdk_rotation_angle, locator: "RotationAngle property description: angle measured in degrees"}
      - {source: revvity_dtd, locator: "<!ATTLIST t RotationAngle>"}
measurement_property_families:
  LabelSize:
    datatype: float
    codec: float
    rationale: >-
      Expose this XML measurement as a finite numeric value without applying
      CDXString font-run units or a binary INT16 scale to CDXML.
    provenance:
      - {source: sdk_label_style_size, locator: "LabelStyleSize property page: default label font size; binary type does not specify CDXML scale"}
  CaptionSize:
    datatype: float
    codec: float
    rationale: >-
      Expose this XML measurement as a finite numeric value without applying
      CDXString font-run units or a binary INT16 scale to CDXML.
    provenance:
      - {source: sdk_caption_style_size, locator: "CaptionStyleSize property page: default caption font size; binary type does not specify CDXML scale"}
  RotationAngle:
    datatype: float
    codec: float
    rationale: >-
      Expose the XML angle numerically; do not infer or apply a binary fixed-point
      scale to the CDXML lexical value.
    provenance:
      - {source: sdk_rotation_angle, locator: "RotationAngle property page identifies the value as an angle in degrees"}
  HeadSize:
    datatype: float
    codec: float
    rationale: >-
      Expose this size measurement as a finite numeric CDXML value; the SDK's
      binary INT16 storage type does not define a CDXML scale or integer-only rule.
    provenance:
      - {source: sdk_page_graphic, locator: "Graphic property table: HeadSize uses kCDXProp_Arrowhead_Size (0x0A20), binary INT16"}
      - {source: sdk_arrow, locator: "Arrow object definition: HeadSize uses the same arrowhead-size property"}
lexical_string_fields:
  font@charset:
    rationale: >-
      CDXML stores a character encoding label such as iso-8859-1. The SDK INT16
      entry is a binary charset code and does not define the XML lexical type.
    provenance:
      - {source: sdk_font_charset_xml, locator: "CDXFontTable datatype page: CDXML charset values are encoding names"}
      - {source: sdk_page_font, locator: "Font page table row 5: INT16 is the binary storage type"}
  arrow@ArrowheadWidth:
    rationale: >-
      Keep this DTD CDATA field lexical. The SDK's HeadWidth property is a
      distinct XML name and does not establish a numeric grammar or fractional
      values for ArrowheadWidth.
    provenance:
      - {source: revvity_dtd, locator: "<!ATTLIST arrow ArrowheadWidth>"}
      - {source: sdk_page_curve, locator: "table[2]/row[44]: SDK XML name HeadWidth, not ArrowheadWidth"}
  plasmidregion@ArrowheadWidth:
    rationale: >-
      Keep this DTD CDATA field lexical. The SDK's HeadWidth property is a
      distinct XML name and does not establish a numeric grammar or fractional
      values for ArrowheadWidth.
    provenance:
      - {source: revvity_dtd, locator: "<!ATTLIST plasmidregion ArrowheadWidth>"}
      - {source: sdk_page_curve, locator: "table[2]/row[44]: SDK XML name HeadWidth, not ArrowheadWidth"}
property_defaults:
  Value:
    value: 0
    provenance:
      - {source: sdk_object_tag_value, locator: "ObjectTag.Value is zero when the value property is absent"}
sdk_property_conflicts:
  - id: curve_spacing_closed_id_conflict
    cdx_id: 2616
    pairs:
      - curve@CurveSpacing
      - curve@Closed
    rationale: >-
      The pinned SDK Curve page assigns 0x0A38 to both Curve_Spacing (UINT16,
      table row 59) and Closed (CDXBoolean, table row 56), with different names
      and incompatible types. Retain their typed CDXML fields but omit a CDX
      numeric mapping until primary-source evidence reconciles the historical conflict.
    provenance:
      - {source: sdk_page_curve, locator: "table[2]/row[59]: Curve_Spacing / UINT16 / 0x0A38"}
      - {source: sdk_page_curve, locator: "table[2]/row[56]: Closed / CDXBoolean / 0x0A38"}
      - {source: revvity_dtd, locator: "<!ATTLIST curve CurveSpacing> and <!ATTLIST curve Closed>"}
cdx_property_aliases:
  - id: document_and_object_tag_name
    cdx_id: 8
    property_ids: [dtd.CDXML.name, dtd.objecttag.name]
    rationale: >-
      Both SDK pages document CDXString kCDXProp_Name (0x0008), while the DTD
      makes CDXML@Name optional and objecttag@Name required. Keep owner-specific
      XML constraints instead of merging the distinct requiredness contracts.
    provenance:
      - {source: sdk_document, locator: "table[2]/row[20]: Name / CDXString / 0x0008"}
      - {source: sdk_page_objecttag, locator: "table[2]/row[5]: Name / CDXString / 0x0008"}
      - {source: revvity_dtd, locator: "<!ATTLIST CDXML Name> and <!ATTLIST objecttag Name #REQUIRED>"}
document_extension_identity: >-
  Declared CDXML object elements with an id attribute use the document identity
  registry even when the pinned SDK inventory has no binary-object declaration.
  This is an explicit XML-layer mutation policy; it does not claim a CDX object
  code or ChemDraw binary identity for those extensions.
lexical_resource_id_policy: >-
  Resource-table id attributes and XML-only property-element identifiers remain
  lexical strings unless a source-backed local-ID rule applies; they never enter
  the document-wide ID allocator.
content_model_policy: >-
  Static child collections record declared DTD child relationships. Sequence,
  choice, mixed-content ordering, and interleaved cardinality grammar are not
  claimed as strict validation; the special root/font/color minimums are retained.
source_anomalies:
  - id: altgroup_undeclared_bracket_child
    parent_xml_tag: altgroup
    child_xml_tag: bracket
    locator: "<!ELEMENT altgroup> references bracket; no <!ELEMENT bracket> exists in the pinned DTD."
    behavior: "Do not generate a bracket model; retain the encountered element as UnknownElement."
