exceptions:
- id: alias_document_and_object_tag_name_dtd_cdxml_name
  rule: duplicate_property_cdx_id
  target: property:dtd.CDXML.name
  rationale: Both SDK pages document CDXString kCDXProp_Name (0x0008), while the DTD makes CDXML@Name
    optional and objecttag@Name required. Keep owner-specific XML constraints instead of merging the distinct
    requiredness contracts.
  provenance: &id001
  - source: sdk_document
    locator: 'table[2]/row[20]: Name / CDXString / 0x0008'
  - source: sdk_page_objecttag
    locator: 'table[2]/row[5]: Name / CDXString / 0x0008'
  - source: revvity_dtd
    locator: '<!ATTLIST CDXML Name> and <!ATTLIST objecttag Name #REQUIRED>'
- id: alias_document_and_object_tag_name_dtd_objecttag_name
  rule: duplicate_property_cdx_id
  target: property:dtd.objecttag.name
  rationale: Both SDK pages document CDXString kCDXProp_Name (0x0008), while the DTD makes CDXML@Name
    optional and objecttag@Name required. Keep owner-specific XML constraints instead of merging the distinct
    requiredness contracts.
  provenance: *id001
